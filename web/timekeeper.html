<html lang="en" data-timekeeper-ui="v1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Time Keeper</title>
  <link rel="stylesheet" href="/timekeeper.css">
</head>
<body>
  <main>
    <header>
      <div><h1>Time Keeper<small>PROJECT EXECUTION MEMORY</small></h1></div>
      <div class="status" id="connection">Connecting to local API…</div>
    </header>
    <div class="grid">
      <section class="card">
        <h2>Create project</h2>
        <form id="project-form">
          <label for="name">Name</label><input id="name" name="name" required maxlength="200" autocomplete="off">
          <label for="goal">Goal</label><input id="goal" name="goal" maxlength="1000">
          <label for="description">Description</label><textarea id="description" name="description" maxlength="10000"></textarea>
          <button id="submit" type="submit">Create project</button>
        </form>
        <div id="message" role="status"></div>
      </section>
      <section class="card">
        <h2>Open projects</h2>
        <div id="projects" class="empty">Loading…</div>
      </section>
    </div>
  </main>
  <script src="/timekeeper.js"></script>
</body>
</html>
